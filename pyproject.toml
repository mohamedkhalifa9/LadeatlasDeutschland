[project]
name = "ladeatlas-deutschland"
version = "0.1.0"
description = "Data engineering project on the Bundesnetzagentur Ladesäulenregister: cloud ingestion, star-schema modelling, data quality, Power BI, and text-to-SQL."
readme = "README.md"
authors = [
    { name = "Mohamed Khalifa", email = "Mohamed.khalifa1@rwth-aachen.de" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "polars>=1.44.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false
